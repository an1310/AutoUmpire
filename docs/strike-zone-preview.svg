<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="432" viewBox="0 0 1000 432" role="img" aria-labelledby="t d">
<title id="t">AutoUmpire visualization — two different batter heights</title>
<desc id="d">Side by side schematic augmented strike zone overlays for a 5 foot batter and a 6 foot 3 batter with different zone elevations. Not a camera image or rule-certified dimensions.</desc>
<rect width="1000" height="432" fill="#101927"/>
<text x="20" y="29" fill="#ffce56" font-size="14" font-weight="bold" letter-spacing="3" font-family="Arial,sans-serif">AUTOUMPIRE / DISPLAY CONCEPT</text>
<text x="20" y="49" fill="#c3cad7" font-size="12" font-family="Arial,sans-serif">What a spatial overlay could look like · schematic, not a real headset screenshot</text>
<g transform="translate(20 65)">
<g transform="translate(0 0)">
 <rect x="0" y="0" width="480" height="358" rx="14" fill="#18283d" stroke="#33445b"/>
 <text x="24" y="34" fill="#f8fafc" font-family="Arial,sans-serif" font-size="22" font-weight="bold">BATTER A  ·  5′0″</text>
 <text x="24" y="55" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">152.4 cm • illustrative stance</text>
 <path d="M60,300 L420,300" stroke="#718096" stroke-width="2"/>
 <polygon points="99,297 213,297 213,313 158,339 99,313" fill="#f4f7ff" stroke="#73879e" stroke-width="2" />
 <path d="M104,141 L208,141 L208,222 L104,222 Z" fill="#ffd466" fill-opacity=".12" stroke="#ffce56" stroke-width="3"/>
 <path d="M104,141 L156,156 L208,141 M104,222 L156,237 L208,222" stroke="#ffce56" stroke-width="1.3" stroke-dasharray="5 5" fill="none"/>
 <text x="156" y="130" fill="#ffdb79" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">TOP</text>
 <text x="156" y="253" fill="#ffdb79" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">BOTTOM</text>
 <circle cx="246" cy="101" r="22" fill="#a3c4de" stroke="#d7e6f0" stroke-width="2"/>
 <path d="M246,139 L246,182.59" stroke="#90b3d2" stroke-width="21" stroke-linecap="round"/>
 <path d="M246,182.59 L212,264 M246,182.59 L282,264" stroke="#90b3d2" stroke-width="15" stroke-linecap="round" fill="none"/>
 <path d="M246,156 L218,221 M246,156 L282,215" stroke="#90b3d2" stroke-width="12" stroke-linecap="round"/>
 <text x="24" y="335" fill="#9fafc6" font-family="Arial,sans-serif" font-size="12">17-inch home plate • 3D zone (schematic)</text>
 </g>
<g transform="translate(0 0)">
 <rect x="500" y="0" width="480" height="358" rx="14" fill="#18283d" stroke="#33445b"/>
 <text x="524" y="34" fill="#f8fafc" font-family="Arial,sans-serif" font-size="22" font-weight="bold">BATTER B  ·  6′3″</text>
 <text x="524" y="55" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">190.5 cm • illustrative stance</text>
 <path d="M560,300 L920,300" stroke="#718096" stroke-width="2"/>
 <polygon points="599,297 713,297 713,313 658,339 599,313" fill="#f4f7ff" stroke="#73879e" stroke-width="2" />
 <path d="M604,91 L708,91 L708,213 L604,213 Z" fill="#ffd466" fill-opacity=".12" stroke="#ffce56" stroke-width="3"/>
 <path d="M604,91 L656,106 L708,91 M604,213 L656,228 L708,213" stroke="#ffce56" stroke-width="1.3" stroke-dasharray="5 5" fill="none"/>
 <text x="656" y="80" fill="#ffdb79" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">TOP</text>
 <text x="656" y="244" fill="#ffdb79" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">BOTTOM</text>
 <circle cx="746" cy="49" r="22" fill="#a3c4de" stroke="#d7e6f0" stroke-width="2"/>
 <path d="M746,87 L746,158.15" stroke="#90b3d2" stroke-width="21" stroke-linecap="round"/>
 <path d="M746,158.15 L712,264 M746,158.15 L782,264" stroke="#90b3d2" stroke-width="15" stroke-linecap="round" fill="none"/>
 <path d="M746,104 L718,169 M746,104 L782,163" stroke="#90b3d2" stroke-width="12" stroke-linecap="round"/>
 <text x="524" y="335" fill="#9fafc6" font-family="Arial,sans-serif" font-size="12">17-inch home plate • 3D zone (schematic)</text>
 </g>
</g>
<text x="500" y="419" text-anchor="middle" fill="#a1afc3" font-family="Arial,sans-serif" font-size="12">Illustrative boundaries only • actual stance landmarks and plate alignment must be calibrated</text>
</svg>
