name: CI
on:
  pull_request:
  push:
    branches: [main, prototype/webxr-zone-v0]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  cv-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calibration and tracking dependencies
        run: pip install -r requirements-cv.txt
      - name: Install ffmpeg (HDR tone mapping)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          # The HDR tests skip without these filters; fail here instead of skipping silently.
          ffmpeg -hide_banner -filters | grep -E ' (zscale|tonemap) ' | wc -l | grep -qx 2
      - name: Marker, stance, practice-footage and HDR input tests
        run: python -m unittest discover -s tests_py -v
      - name: Python syntax validation
        run: python -m compileall -q autoumpire_cv tools/track_video.py tools/calibrate_camera.py tools/generate_marker.py tools/simulate_registration.py

  ar-emulation:
    # Emulated WebXR AR headset (IWER) in headless Chromium: drives the real
    # two-tap plate placement. Does not cover dom-overlay or real tracking.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: AR placement under emulation
        run: npm run test:ar
