name: CI
on:
  pull_request:
  push:
    branches: [main, prototype/webxr-zone-v0]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  cv-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calibration and tracking dependencies
        run: pip install -r requirements-cv.txt
      - name: Synthetic marker and stance tests
        run: python -m unittest discover -s tests_py -v
      - name: Python syntax validation
        run: python -m compileall -q autoumpire_cv tools/track_video.py tools/calibrate_camera.py tools/generate_marker.py
